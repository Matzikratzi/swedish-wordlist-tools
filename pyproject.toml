saol14-analyze-adjective-replace-tail-review = "swedish_wordlist_tools.analyze_adjective_replace_tail_review:main"
saol14-analyze-adjective-append-review = "swedish_wordlist_tools.analyze_adjective_append_review:main"
saol14-analyze-adjective-final-adjudication = "swedish_wordlist_tools.analyze_adjective_final_adjudication:main"

[tool.setuptools.packages.find]
where = ["src"]
