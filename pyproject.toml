saol14-analyze-remaining-verbs = "swedish_wordlist_tools.analyze_remaining_verbs:main"
saol14-analyze-verb-hard-cap = "swedish_wordlist_tools.analyze_verb_hard_cap:main"
saol14-analyze-imperatives = "swedish_wordlist_tools.analyze_imperatives:main"
saol14-analyze-verb-hv = "swedish_wordlist_tools.analyze_verb_hv:main"
saol14-analyze-adjectives = "swedish_wordlist_tools.analyze_adjectives:main"
saol14-generate-adjective-forms = "swedish_wordlist_tools.generate_adjective_forms:main"
