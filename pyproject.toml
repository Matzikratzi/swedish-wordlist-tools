[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swedish-wordlist-tools"
version = "0.1.0"
description = "Tools for analysing SAOL 14 and generating Swedish word lists"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mats Järgenstedt"}]
dependencies = []

[project.scripts]
saol14-download = "swedish_wordlist_tools.download:main"
saol14-inspect = "swedish_wordlist_tools.inspect:main"
saol14-generate = "swedish_wordlist_tools.inflect:main"
saol14-audit = "swedish_wordlist_tools.audit:main"
saol14-compare-saldo = "swedish_wordlist_tools.compare_sources:main"
saol14-list-msd = "swedish_wordlist_tools.list_msd:main"
saol14-finalise-shared-wordlist = "swedish_wordlist_tools.build_final_wordlist:main"
saol14-audit-final-saldo = "swedish_wordlist_tools.audit_final_wordlist_saldo:main"
saol14-analyze-final-saldo-candidates = "swedish_wordlist_tools.analyze_final_saldo_candidates:main"
saol14-build-final-wordlist = "swedish_wordlist_tools.build_final_wordlist_pipeline:main"
saol14-game-wordlist-legacy = "swedish_wordlist_tools.game_wordlist:main"
saol14-build-game-wordlist-legacy = "swedish_wordlist_tools.build_game_wordlist_pipeline:main"
saol14-audit-game-adjective-integration = "swedish_wordlist_tools.audit_game_adjective_integration:main"
saol14-analyze-unmatched = "swedish_wordlist_tools.analyze_unmatched:main"
saol14-analyze-compounds = "swedish_wordlist_tools.analyze_compounds:main"
saol14-analyze-saol-bars = "swedish_wordlist_tools.analyze_saol_bars:main"
saol14-analyze-saol-bar-counts = "swedish_wordlist_tools.analyze_saol_bar_counts:main"
saol14-validate-direct-forms = "swedish_wordlist_tools.validate_direct_forms_lexeme:main"
saol14-analyze-noun-validation = "swedish_wordlist_tools.analyze_noun_validation:main"
saol14-analyze-paradigm-differences = "swedish_wordlist_tools.analyze_paradigm_differences:main"
saol14-analyze-form-mismatches = "swedish_wordlist_tools.analyze_form_mismatches:main"
saol14-analyze-brackets = "swedish_wordlist_tools.analyze_bracket_annotations:main"
saol14-analyze-notation-mismatches = "swedish_wordlist_tools.analyze_notation_mismatches:main"
saol14-analyze-noun-mismatch-patterns = "swedish_wordlist_tools.analyze_noun_mismatch_patterns:main"
saol14-analyze-top-noun-mismatch-groups = "swedish_wordlist_tools.analyze_top_noun_mismatch_groups:main"
saol14-analyze-noun-mismatch-causes = "swedish_wordlist_tools.analyze_noun_mismatch_causes:main"
saol14-analyze-rule-usage = "swedish_wordlist_tools.analyze_rule_usage:main"
saol14-analyze-row-interpreter = "swedish_wordlist_tools.analyze_row_interpreter:main"
saol14-validate-row-interpreter-saldo = "swedish_wordlist_tools.validate_row_interpreter_saldo:main"
saol14-analyze-verb-slots = "swedish_wordlist_tools.analyze_verb_slots:main"
saol14-analyze-verb-compound-heads = "swedish_wordlist_tools.analyze_verb_compound_heads:main"
saol14-analyze-verb-participles = "swedish_wordlist_tools.analyze_verb_participles:main"
saol14-validate-verb-participles-saldo = "swedish_wordlist_tools.validate_verb_participles_saldo:main"
saol14-analyze-saldo-verb-fallback = "swedish_wordlist_tools.analyze_saldo_verb_fallback:main"
saol14-export-verb-forms = "swedish_wordlist_tools.export_verb_forms:main"
